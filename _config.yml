# _config.yml — la configurazione Jekyll del sito. WD19, deciso da Pier il 21/09/2026.
#
# ⛔ QUESTO FILE NON COSTRUISCE PAGINE. Fa due cose sole:
#   ① tiene i file di lavoro FUORI da ciò che Pages pubblica su aimonx.app;
#   ② dice al sito come si chiama, così le pagine non si dichiarano più `http://`.
# Tema, layout e pagine arrivano con WA4, e il testo lo scrive Cowork.

# ② L'indirizzo del sito. ⚠️ Misurato prima di questo file: la home diceva
# `<link rel="canonical" href="http://aimonx.app/">`, cioè annunciava al mondo
# la versione in chiaro di sé stessa. Da qui in poi dice https.
url: https://aimonx.app
baseurl: ""

# Il nome del repo su GitHub. ⚠️ NON è un duplicato di quello che git già sa:
# misurato nel giro W2, una build `--safe` — cioè come costruisce Pages — NON
# legge il remote git, e `jekyll-github-metadata` la fa FALLIRE con
# «No repo name found» appena una pagina usa un layout. Senza questa riga il
# comando di costruzione funziona solo se chi lo lancia si ricorda di passare
# PAGES_REPO_NWO, e un comando che dipende dalla memoria di qualcuno si rompe
# il giorno in cui quel qualcuno è un altro.
repository: aimonxapp/aimonx

# ⛔ NIENTE TEMA: è così che si chiude WD26. Fino a ieri il sito usava
# `jekyll-theme-primer`, il tema che Pages mette per difetto, e quel tema
# caricava `anchor.min.js` da `cdnjs.cloudflare.com`: ogni visita ad
# aimonx.app diceva a un server terzo chi era passato. Su un sito che vende
# privacy locale è una contraddizione che il pubblico può leggere — e per il
# GDPR è l'IP del visitatore mandato a un terzo senza motivo
# (`conformita-sito.md` §1, precedente LG München 20/01/2022).
#
# ⭐ `theme: null` NON è un trucco: il gem `github-pages` 232 lo prevede
# apposta — `lib/github-pages/configuration.rb` riga 100, commento
# «Allow theme to be explicitly disabled via "theme: null"», e la riga dopo
# copia il valore dell'utente sopra il difetto. Misurato lì, non ipotizzato.
# ⚠️ Con il tema se ne va anche il suo `assets/css/style.css`: da oggi il
# foglio di stile del sito è il nostro, in `assets/css/`.
theme: null

# ⭐ LA MAPPA DEL SITO, dal giro W10. `jekyll-sitemap` costruisce `sitemap.xml`
# da ciò che il sito PUBBLICA DAVVERO, e questa è la ragione per cui si
# preferisce a un file scritto a mano: una mappa scritta a mano è un elenco
# copiato, e un elenco copiato invecchia senza dirlo — la pagina nuova non ci
# finisce, e la pagina tolta ci resta a puntare un 404.
#
# ⛔ NON È UNA DIPENDENZA NUOVA, e la differenza conta: `jekyll-sitemap 1.4.0`
# è già dentro `github-pages` 232 (Gemfile.lock), cioè è già installato e già
# eseguito da Pages. Qui si ACCENDE, non si aggiunge. ⚠️ Non è fra quelli che
# Pages accende da sé: `aimonx.app/sitemap.xml` rispondeva 404 fino a oggi.
#
# ⛔ E QUESTA LISTA NON È COME `exclude` QUI SOTTO — misurato, non supposto,
# nel gem `github-pages-232` (`lib/github-pages/configuration.rb`):
#   · riga 168, `configure_plugins`: `config["plugins"] = Array(config["plugins"]) | DEFAULT_PLUGINS`
#     → UNIONE. Scrivere `plugins:` NON spegne i plugin di difetto di GitHub.
#   · riga 160, `configure_exclude`: `return unless config["exclude"].eql? Jekyll::Configuration::DEFAULTS["exclude"]`
#     → SOSTITUZIONE. Scrivere `exclude:` spegne le esclusioni di difetto, ed è
#     esattamente `WD29`.
# ⚠️ Due liste nello stesso file che si comportano al contrario l'una
# dell'altra: è il motivo per cui il gem si legge invece di ricordarselo.
plugins:
  - jekyll-sitemap

# ① Cosa NON esce su aimonx.app.
#
# ⛔ SI LEGGE AL CONTRARIO DI COME SEMBRA: `exclude` è una lista di ciò che si
# nega, e una lista di negazioni FALLISCE APERTA — un file nuovo alla radice è
# pubblicato finché qualcuno non se ne accorge. ⭐ Per questo la controprova
# conta i .md tracciati che diventerebbero pagine (`pagine_dal_merge`): il
# numero sale da sé quando entra un file, e nessuno deve ricordarsene.
#
# ⭐ README.md ORA È QUI, e il giro W4 è il motivo: fino a ieri era l'unica
# pagina del sito — escluderlo avrebbe spento la home. Da oggi la home è la
# landing (`index.html`), e il README torna a essere quello che è, cioè il
# cartello del repo su github.com. ⚠️ Con lui esce di scena anche il suo
# sorgente: `aimonx.app/README.md` era servito accanto alla pagina, perché un
# .md senza front matter Jekyll lo pubblica DUE volte (WD27). Le pagine nuove
# il front matter ce l'hanno tutte.
#
# ⛔ LICENSE NON È UN FILE DI TESTO QUALUNQUE: senza questa riga Jekyll lo
# copia tale e quale e diventa `aimonx.app/LICENSE`, cioè una pagina del sito
# che nessuno ha deciso di pubblicare. Stessa famiglia di CNAME qui sotto, e
# stessa lezione (WD29): una lista di negazioni non nomina ciò che non c'era
# quando è stata scritta.
#
# ⛔ CNAME È QUI PERCHÉ QUESTA LISTA ESISTE, e non è un doppione di GitHub.
# Misurato nel giro W3 nel gem `github-pages-232` (configuration.rb,
# `exclude_cname`): GitHub aggiunge CNAME alla lista SOLO SE la lista è ancora
# quella di default di Jekyll. Da quando WD19 l'ha riscritta, non lo è più, e
# l'esclusione di GitHub smette di valere in silenzio. Senza questa riga il
# merge avrebbe acceso `aimonx.app/CNAME` (oggi 404). Il dominio non gli serve
# lì: sta nelle impostazioni di Pages (`gh api repos/aimonxapp/aimonx/pages`
# → `cname`). ⚠️ Vale per OGNI default di GitHub che dipenda dalla lista:
# riscrivere una lista di negazioni disattiva anche quelle di chi ci sta sotto.
exclude:
  - CNAME              # il dominio: lo tiene Pages, non il sito costruito
  - README.md          # il cartello del repo, non una pagina del sito
  - LICENSE            # la licenza del repo, non una pagina del sito
  - CLAUDE.md          # il metodo di lavoro
  - docs/              # registro degli aperti e piano di chiusura
  - scripts/           # controprova, attese, hook di push
  - .claude/           # impostazioni e skill di Claude Code
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/
