  codice: "RANGESYSTEM"
  link: "Redeem the code"
  nota: "Good until May 1, 2027. We'd love to see your box, too: send a photo to support@aimonx.app and we might share it on our site and socials."
- tipo: h3
  testo: "Want another caliber?"
- tipo: p
  testo: "Tell us which one, and whether you want 50 or 100 rounds, in the comments on MakerWorld."
  link: "MakerWorld"
- tipo: h3
  testo: "What's AIMONX?"
- tipo: p
  testo: "The app this box was made for. AIMONX is a logbook for sport shooters: log a range session and each firearm's round count, your ammo on hand and your maintenance all update on their own. Encrypted on your iPhone, no account."

