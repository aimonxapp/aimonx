# _data/privacy.yml — IL TESTO DELLA PAGINA PRIVACY POLICY, UNA VOLTA SOLA.
#
# ⛔ QUESTO FILE NON È CODICE: è il testo approvato da Pier il 22/09/2026, che
# sta nella sua cartella dei contenuti.
# ⭐ DAL GIRO W30 LA BOZZA È QUELLA DELLA 1.1.0 DELL'APP (approvata da Pier il
# 26/10/2026): cinque punti cambiati — la posizione dei luoghi, la sezione
# «Location», le foto, e la copia in iCloud che si spegne da iOS e non
# dall'app — e il resto identico:
#     …/2- Contenuti/privacy-policy/privacy-policy-en-1.1.0-bozza.md
# ⚠️ Il segno 🆕 con cui la bozza marca i punti nuovi non va in pagina, e il
# controllo lo toglie come le note fra quadre. «[your name]» invece è testo:
# è il segnaposto del percorso nelle Impostazioni di iOS, e la bozza lo vuole.
# Non è stato ricopiato a mano: è stato CONVERTITO, e `scripts/testo-approvato.sh`
# cerca ogni stringa qui dentro ALLA LETTERA in quella bozza. ⭐ Il «parola per
# parola» del giro W9 non è una promessa: è una misura che gira a ogni giro.
#
# ⛔ CHI PUÒ CAMBIARLO: Cowork, non Claude Code. «I testi che l'utente legge li
# scrive Cowork» (CLAUDE.md, «Chi decide cosa»). Se qui dentro serve una parola
# diversa, si cambia la bozza e poi si riporta qui — mai il contrario.
#
# ⛔ QUI DENTRO NON C'È NIENTE CHE NON SIA TESTO. Dove portano le parole sta in
# `_data/collegamenti.yml`, che è di CC: nessun `<a>`, nessun indirizzo e
# nessun markdown in mezzo a una frase, altrimenti quella frase non si
# troverebbe più nella bozza e il controllo avrebbe dovuto imparare
# un'eccezione. ⛔ Un'eccezione che nessuno ricorda è il buco da cui rientra il
# testo riscritto.
#
# ⚠️ `blocchi` è una LISTA ORDINATA e l'ordine è quello della bozza: `h2` e
# `h3` sono i suoi titoli, `p` i suoi paragrafi, `ul` i suoi elenchi puntati.
# `_layouts/pagina.html` li impagina e basta: non sceglie, non riordina, non
# salta. Una voce di tipo ignoto non romperebbe la pagina — uscirebbe come
# paragrafo.

