# _data/navigazione.yml — LE PAROLE DELLA NAVIGAZIONE E DELL'INDICE. Giro W24.
#
# ⛔ QUESTO FILE NON È CODICE: è il testo approvato da Pier il 16/10/2026
# (19:44), che sta nella sua cartella dei contenuti:
#     …/2- Contenuti/navigazione/navigazione-en-bozza.md
# `scripts/testo-approvato.sh` cerca ogni stringa qui dentro ALLA LETTERA in
# quella bozza — solo nelle sezioni che vanno in pagina, non nella rilettura
# né nella tabella «Controllo» — e nella bozza della landing, dove stanno le
# etichette dei link del piede che esistevano già.
#
# ⛔ CHI PUÒ CAMBIARLO: Cowork, non Claude Code (CLAUDE.md, «Chi decide cosa»).
# ⛔ QUI DENTRO CI SONO SOLO PAROLE. Dove porta ciascuna sta in
# `_data/collegamenti.yml` (`menu`), che è di CC; le funzioni della tendina,
# dell'indice e di «More features» stanno in `_data/funzioni.yml`.
#
# ⚠️ LA RIGA «Features · FAQ · Free and Pro · Download» È SPEZZATA VOCE PER
# VOCE, come la barra di prima e per la stessa regola di Pier (22/09): ogni
# pezzo è un link diverso, e il «·» è un segno, non una parola.
# ⛔ Fino al W23 queste voci stavano in `_data/landing.yml` (`menu`): spostate
# qui perché la barra non è della landing, è di tutto il sito.

menu:
  voci:
    - "Home"
    - "Features"
    - "FAQ"
    - "Free and Pro"
  # ⭐ Giro W29 (Pier, 17/10/2026 17:18): «Download» in TUTTE le lingue, ed è
  # scritto QUI e basta — il pulsante in fondo alla barra e l'ultima voce della
  # colonna «App» del piede lo prendono da questo file su ogni versione del
  # sito, e i file delle altre lingue non lo ripetono. ⛔ Il badge di Apple
  # resta nella sua lingua: è un'altra cosa (`hero.badge`, `badge`).
  scarica: "Download"
  # ⚠️ La voce che si apre è quella che porta all'indice delle funzioni
  # (`_data/collegamenti.yml`, `apre`), e sotto di lei vanno le funzioni con
  # una pagina e, in fondo, questa.
  tutte: "All features"
  # Il pulsante del telefono, chiuso e aperto.
  apri: "Menu"
  chiudi: "Close"

# Le briciole di pane: «Home › Features › <nome breve>», «Home › Free and Pro».
# ⚠️ Le voci di mezzo sono quelle del menu qui sopra, cercate per indirizzo, e
# il nome breve viene da `_data/funzioni.yml`: qui c'è solo la parola della
# casa. Il «›» lo mette il layout: è un segno.
briciole:
  casa: "Home"

# ⭐ Le etichette per i lettori di schermo, INVISIBILI a schermo: il nome delle
# due regioni di navigazione (sezione «Etichette per i lettori di schermo»
# della bozza, 16/10/2026 21:37). ⚠️ Le colonne del piede non ne hanno una
# loro: si etichettano coi titoli già in pagina (`piede`, qui sotto).
etichette:
  menu: "Main menu"
  briciole: "Breadcrumb"
  # ⭐ Giro W28: il selettore di lingua in alto (sezione «Language selector and
  # footer column» della bozza, approvata da Pier il 17/10/2026 14:34).
  lingua: "Language"

# Il titolo dell'elenco delle pagine sorelle, nelle pagine-funzione.
sorelle: "More features"

# Il piede a colonne. ⚠️ Le etichette dei link sono quelle già approvate.
# ⭐ Giro W25 (Pier, 16/10/2026 22:07): quattro colonne, e «Home» torna.
# ⚠️ La colonna «Features» NON ha `voci`: le sue sono le funzioni con una
# pagina, dalla fonte unica (`_data/funzioni.yml`), più «All features» — una
# pagina nuova ci compare da sola (`_includes/piede.html`).
piede:
  - titolo: "App"
    voci:
      - "Home"
      - "Free and Pro"
      - "What's new"
    # ⭐ Giro W29: in fondo alla colonna, «Download» (`menu.scarica`, qui sopra).
    scarica: true
  - titolo: "Features"
    dalla_fonte: true
  - titolo: "Learn"
    voci:
      - "FAQ"
  - titolo: "Support"
    voci:
      - "Support"
      - "Privacy Policy"
      - "Terms of Use"
  # ⭐ Giro W28: la quinta colonna, le lingue. ⚠️ Non ha `voci`: sono quelle del
  # selettore in alto, una per lingua, coi nomi di `_data/lingue.yml`.
  - titolo: "Language"
    lingue: true

# La pagina indice `/features/` — sezioni «Meta» e «Page» della bozza.
indice:
  meta:
    title: "Features: Round Count, Maintenance, Custom Lists | AIMONX"
    description: "Everything AIMONX keeps track of: firearms, rounds, range sessions, ammo, maintenance, renewals, costs and stats. On your iPhone, with no account."
  titolo: "Everything AIMONX keeps track of"
  sommario: "One app for your firearms, your rounds, your ammo and your maintenance. Pick a feature to see how it works."
  # ⛔ NON SI SCRIVE IN PAGINA: è il testo alternativo del badge di Apple.
  badge: "Download on the App Store"
