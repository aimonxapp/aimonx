meta:
  title: "Comment choisir une app de journal de tir : 9 points à vérifier | AIMONX"
  description: "Comptage des coups, entretien, munitions, confidentialité, sauvegardes et ce qui est vraiment gratuit. Ce qu'il faut vérifier avant de confier des années de données à une app."
titolo: "Comment choisir une app de journal de tir"
sommario: "Il existe des dizaines d'apps pour noter ses armes, ses munitions et ses séances au stand, et dans l'App Store beaucoup se ressemblent. Voici ce que nous vérifierions avant de confier des années de données à l'une d'elles. Nous en faisons une, alors à la fin nous vous disons où en est AIMONX, y compris là où elle ne suffit pas."
blocchi:
- tipo: "h2"
  testo: "1. Compte-t-elle les coups pour vous ?"
- tipo: "p"
  testo: "Certaines apps vous font saisir un total à la main. Les meilleures additionnent vos séances : vous notez ce que vous avez tiré, et le compteur de l'arme suit. Corrigez une faute dans une ancienne séance, pour voir : le total doit se corriger tout seul."
- tipo: "h2"
  testo: "2. L'entretien par coups, par temps, ou les deux"
- tipo: "p"
  testo: "Un nettoyage tous les 500 coups, un ressort récupérateur neuf à 5 000, une lubrification tous les trois mois. Une bonne app vous laisse créer vos propres règles, arme par arme, par coups ou par calendrier, et vous prévient avant l'échéance."
- tipo: "h2"
  testo: "3. Suit-elle les munitions, et ce qu'elles coûtent ?"
- tipo: "p"
  testo: "Cherchez des munitions qu'on enregistre par boîte, un stock qui baisse à mesure que vous tirez, une alerte quand vous arrivez au bout et un vrai coût par cartouche. Si vous rechargez, vérifiez qu'elle gère les recettes et le coût des composants, et pas seulement les munitions manufacturées."
- tipo: "h2"
  testo: "4. Où vont vos données ?"
- tipo: "p"
  testo: "C'est la question principale. L'app demande-t-elle un compte ? Vos données partent-elles sur les serveurs du développeur, ou restent-elles sur votre téléphone ? Sont-elles chiffrées ? Sur la page de chaque app, l'App Store affiche une étiquette de confidentialité : lisez-la avant de télécharger."
- tipo: "h2"
  testo: "5. Pouvez-vous récupérer vos données ?"
- tipo: "p"
  testo: "Les téléphones se perdent, et on change d'app. Regardez comment marchent les sauvegardes, si vous pouvez tout transférer sur un nouvel iPhone, et ce que vous pouvez exporter : un PDF pour vos dossiers ou votre assurance, un tableur, une archive complète."
- tipo: "h2"
  testo: "6. Que se passe-t-il si vous arrêtez de payer ?"
- tipo: "p"
  testo: "Certaines apps bloquent vos données, d'autres les effacent, d'autres les laissent lisibles. Renseignez-vous avant d'avoir noté trois ans de séances."
- tipo: "h2"
  testo: "7. Sur quels appareils ?"
- tipo: "p"
  testo: "iPhone seulement, ou aussi iPad et Mac ? Android ? Se synchronise-t-elle entre vos appareils, ou vit-elle sur un seul ?"
- tipo: "h2"
  testo: "8. Qu'est-ce qui est vraiment gratuit ?"
- tipo: "p"
  testo: "Les offres gratuites varient beaucoup : certaines limitent le nombre d'armes, d'autres réservent l'entretien ou les statistiques à la version payante. Regardez les limites, et s'il existe un essai gratuit de l'offre payante."
- tipo: "h2"
  testo: "9. Quelqu'un y travaille-t-il encore ?"
- tipo: "p"
  testo: "Ouvrez l'Historique des versions de l'app dans l'App Store et regardez la date de la dernière mise à jour. Lisez ensuite quelques avis, et voyez si le développeur y répond."
- tipo: "h2"
  testo: "Où en est AIMONX"
- tipo: "tabella"
  intestazione: ["Ce qu'il faut vérifier", "AIMONX"]
  righe:
  - - "Compte les coups pour vous"
    - "Oui. Vous enregistrez une séance et le total de l'arme se met à jour. Vous modifiez ou supprimez une séance, et les totaux suivent."
  - - "Entretien"
    - "Vos propres règles par coups, par temps ou les deux, avec le préavis que vous choisissez. Ce qui arrive à échéance se voit dans l'app : il n'y a pas de notifications d'entretien."
  - - "Munitions et coûts"
    - "Chaque boîte achetée, les lots les plus anciens utilisés en premier, le coût par cartouche, l'alerte de stock bas. Les recettes et le coût des composants font partie de Pro."
  - - "Où vont vos données"
    - "Chiffrées sur votre iPhone, avec une copie chiffrée dans votre propre iCloud, que vous pouvez désactiver. Aucun compte. Aucun serveur AIMONX."
  - - "Récupérer vos données"
    - "Le PDF d'une arme ou de tout votre inventaire, gratuit. Une archive complète à transférer sur un nouvel iPhone fait partie de Pro. Pas d'export vers un tableur."
  - - "Si vous arrêtez de payer"
    - "Rien n'est effacé. Ce qui dépasse les limites gratuites passe en lecture seule, et redevient utilisable quand vous vous réabonnez."
  - - "Appareils"
    - "iPhone seulement. Pas d'app pour iPad, Mac ou Android, et pas de synchronisation entre appareils."
  - - "Ce qui est gratuit"
    - "Une arme active avec des séances illimitées, les munitions manufacturées, une règle de nettoyage par arme, toutes les statistiques et le calcul du facteur de puissance. Le premier mois de Pro est gratuit pour les nouveaux abonnés."
  - - "Quelqu'un y travaille"
    - "La version 1.1.0 est sortie en novembre 2026. Chaque mise à jour est sur notre page Nouveautés."
badge: "Télécharger dans l'App Store"
