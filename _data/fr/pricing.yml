meta:
  title: 'Free et Pro : formules et tarifs | AIMONX'
  description: AIMONX se télécharge gratuitement, et Free est un vrai journal. Pro coûte 1,99 € par mois ou 14,99 € par an, et le premier mois est offert aux nouveaux abonnés. Comparez les deux formules.
