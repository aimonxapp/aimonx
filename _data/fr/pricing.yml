blocchi:
- titolo: Ce que coûte Pro
  forte: Pro coûte 1,99 € par mois ou 14,99 € par an.
  testo: Le premier mois est offert aux nouveaux abonnés, sur l'abonnement mensuel ou annuel. Ensuite, Pro se renouvelle au prix normal, sauf si vous l'annulez au moins 24 heures avant la fin du mois.
  poi: 'Le partage familial est inclus : votre famille profite aussi de Pro. Résiliable à tout moment. Les prix varient selon les pays : l''App Store affiche le vôtre.'
- titolo: Si Pro s'arrête
  forte: Si votre abonnement Pro s'arrête, rien ne se perd.
  testo: Tout ce qui dépasse les limites de Free reste lisible, simplement figé, jusqu'à votre retour.
  link: Voir ce qui se passe quand Pro s'arrête
- titolo: D'autres nouveautés arrivent
  testo: De nombreuses fonctionnalités arrivent dans les prochaines mises à jour, pensées pour la façon dont les tireurs sportifs s'entraînent vraiment.
badge: Télécharger dans l'App Store
