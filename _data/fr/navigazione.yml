    title: 'Fonctionnalités : compteur de coups, entretien, listes | AIMONX'
    description: 'Tout ce que suit AIMONX : armes, coups, séances, munitions, entretien, renouvellements, coûts et statistiques. Sur votre iPhone, sans compte.'
  titolo: Tout ce que suit AIMONX
