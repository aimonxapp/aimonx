- tipo: "h2"
  testo: "Comment se font les calculs"
- tipo: "p"
  testo: "Chaque composant coûte ce que vous l'avez payé, divisé par le nombre de pièces. La poudre demande une étape de plus : son prix, divisé par le poids du conditionnement en grains, multiplié par votre charge. 500 grammes font environ 7 716 grains : un pot de 500 g à 40 € revient à un peu plus d'un demi-centime le grain, et une charge de 4,2 grains coûte environ 2 centimes."
- tipo: "h2"
  testo: "Gardez-la, production après production"
- tipo: "p"
  testo: "Cette page fait le calcul une fois. AIMONX garde vos recettes sur votre iPhone, donne à chaque production son propre coût, et ajoute ce que vous tirez à chaque séance au stand : vous savez toujours ce que vous a vraiment coûté une journée de tir."
- tipo: "p"
  testo: "La fiche à imprimer est un outil du site. Dans l'app, vos recettes restent sur votre iPhone, avec chaque production que vous rechargez."
- tipo: "h2"
  testo: "Free et Pro"
- tipo: "p"
  testo: "Le calculateur de cette page est gratuit pour tout le monde. Dans l'app, les recettes, le coût des composants et les productions font partie de Pro. Le calcul du facteur de puissance est gratuit des deux côtés."
