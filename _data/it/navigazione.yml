# _data/it/navigazione.yml — LE PAROLE DELLA NAVIGAZIONE E DELL'INDICE, in
# italiano. Giro W28.
#
# ⛔ QUESTO FILE NON È CODICE: è il testo approvato da Pier il 17/10/2026
# (14:34), nella sua cartella dei contenuti:
#     …/2- Contenuti/navigazione/navigazione-it-bozza.md
# ⛔ STESSE CHIAVI di `_data/navigazione.yml`. Dove porta ogni voce sta in
# `_data/it/collegamenti.yml` (`menu`); le funzioni in `_data/it/funzioni.yml`.
# ⛔ CHI PUÒ CAMBIARLO: Cowork, non Claude Code.

menu:
  # ⏳ GIRO W39 (bozza della navigazione, sezione «W39», 09/11/2026, da
  # ripassare da Pier): le cinque sezioni della barra in alto e del piede.
  # Dove porta ciascuna, e cosa c'è dentro, lo dice `_data/collegamenti.yml`
  # (`sezioni`), che è di CC: qui solo le parole.
  sezioni:
    funzioni: "Funzioni dell'app"
    range: "Range System"
    strumenti: "AX Strumenti e guide"
    prezzi: "Prezzi"
    assistenza: "Assistenza"
  tutte: "Tutte le funzioni"
  # Il pulsante del telefono, chiuso e aperto.
  apri: "Menu"
  chiudi: "Chiudi"
  # ⭐ Giro W39: i NOMI DELLE PAGINE nei pannelli del menu e nel piede, per
  # chiave (dove porta ciascuna: `_data/collegamenti.yml`, `pagine`). Parole
  # già approvate, spostate qui dalla mappa dei link perché la modalità
  # modifica le veda; una pagina che in questa lingua non c'è non ha la riga.
  pagine:
    novita: "Novità"
    prezzi: "Free e Pro"
    faq: "FAQ"
    assistenza: "Supporto"
    recensione: "Scrivi una recensione"
    chi: "Chi sono"
    privacy: "Privacy Policy"
    termini: "Termini d'uso"

# Le briciole di pane: «Home › Features › <nome breve>». ⚠️ `voci` è la barra
# di PRIMA del W39, con le parole già approvate: le briciole la usano per
# trovare il nome della voce di mezzo dal suo indirizzo (`_includes/briciole-calcola.html`).
# Il «›» lo mette il layout: è un segno.
briciole:
  casa: "Home"
  voci:
    - "Home"
    - "Funzioni"
    - "FAQ"
    - "Range System"
    - "Free e Pro"

# ⭐ Le etichette per i lettori di schermo, INVISIBILI a schermo. `lingua` è
# anche il titolo delle lingue nel piede; ⏳ `casa` (W39) è il nome del logo, che
# da solo porta alla home.
etichette:
  menu: "Menu principale"
  briciole: "Percorso"
  lingua: "Lingua"
  casa: "Home di AIMONX"

# Il titolo dell'elenco delle pagine sorelle, nelle pagine-funzione.
sorelle: "Altre funzioni"

indice:
  meta:
    title: "Funzioni: contacolpi, manutenzione, liste | AIMONX"
    description: "Tutto quello che AIMONX tiene in ordine: armi, colpi, sessioni, munizioni, manutenzione, scadenze, costi e statistiche. Sul tuo iPhone, senza account."
  titolo: "Tutto quello che AIMONX tiene in ordine"
  sommario: "Un'app sola per le tue armi, i tuoi colpi, le tue munizioni e la tua manutenzione. Scegli una funzione per vedere come funziona."
  # ⛔ NON SI SCRIVE IN PAGINA: è il testo alternativo del badge di Apple.
  badge: "Scarica su App Store"
