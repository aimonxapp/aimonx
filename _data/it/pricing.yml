meta:
  title: "Free e Pro: piani e prezzi | AIMONX"
  description: "AIMONX si scarica gratis, e Free è un diario vero. Pro costa 1,99 € al mese o 14,99 € all'anno, condivisibile con In famiglia. Confronta i due piani."

titolo: "Free e Pro"
sommario: "Comincia con un diario vero, non una demo. Passa a Pro quando ti serve di più."

