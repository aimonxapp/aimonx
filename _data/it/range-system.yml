  link: "MakerWorld"
- tipo: h3
  testo: "Cos'è AIMONX?"
- tipo: p
  testo: "L'app per cui è nata questa scatola. AIMONX è il diario del tiratore sportivo: registri una sessione al poligono e i colpi di ogni arma, le munizioni che hai e la manutenzione si aggiornano da soli. Cifrato sul tuo iPhone, niente account."

