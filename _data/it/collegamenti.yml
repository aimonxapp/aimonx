# ⛔ QUESTO FILE È DI CLAUDE CODE, come `_data/collegamenti.yml`, di cui è la
# gemella: stesse regole, scritte per esteso là — una frase diventa link solo
# nei paragrafi e nelle voci di elenco, dalla più lunga alla più corta.
# ⭐ GLI INDIRIZZI DEL SITO SONO SENZA `/it`: il prefisso lo mettono i layout
# (`_includes/lingua.html`), così la pagina italiana porta alla pagina italiana.
# ⚠️ Gli indirizzi esterni: quello italiano dove Apple ne pubblica uno
