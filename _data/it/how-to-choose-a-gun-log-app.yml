meta:
  title: "Come scegliere un'app per il diario di tiro: 9 cose da controllare | AIMONX"
  description: "Conteggio dei colpi, manutenzione, munizioni, privacy, backup e cosa è gratis davvero. Cosa controllare in un'app prima di affidarle anni di registrazioni."
titolo: "Come scegliere un'app per il diario di tiro"
sommario: "Ci sono decine di app per registrare armi, munizioni e giornate al poligono, e sull'App Store molte si somigliano. Ecco cosa controlleremmo prima di affidarne una ad anni di registrazioni. Una di queste app la facciamo noi: per questo alla fine ti diciamo dove sta AIMONX, compreso dove non arriva."
blocchi:
- tipo: "h2"
  testo: "1. Conta i colpi al posto tuo?"
- tipo: "p"
  testo: "Alcune app ti fanno scrivere il totale a mano. Quelle migliori sommano le tue sessioni: registri cosa hai sparato, e il conteggio dell'arma segue. Prova a correggere un errore in una sessione vecchia: anche il totale si deve correggere da solo."
- tipo: "h2"
  testo: "2. Manutenzione a colpi, a tempo, o tutte e due"
- tipo: "p"
  testo: "Pulizia ogni 500 colpi, molla di recupero nuova a 5.000, lubrificazione ogni tre mesi. Una buona app ti fa scrivere le tue regole, arma per arma, a colpi o a calendario, e ti avvisa prima che una scada."
- tipo: "h2"
  testo: "3. Tiene le munizioni, e quanto costano?"
- tipo: "p"
  testo: "Cerca munizioni che si registrano a scatola, un inventario che scende mentre spari, un avviso quando stai finendo e un costo per colpo vero. Se ricarichi, guarda se gestisce ricette e costi dei componenti, o solo le munizioni commerciali."
- tipo: "h2"
  testo: "4. Dove stanno i tuoi dati?"
- tipo: "p"
  testo: "È la domanda più importante. L'app chiede un account? I tuoi dati vanno sui server di chi l'ha fatta, o restano sul telefono? Sono cifrati? Sulla pagina di ogni app, l'App Store mostra un'etichetta sulla privacy: leggila prima di scaricare."
- tipo: "h2"
  testo: "5. Puoi portare fuori i tuoi dati?"
- tipo: "p"
  testo: "I telefoni si perdono, e le app si cambiano. Guarda come funzionano i backup, se puoi spostare tutto su un iPhone nuovo e cosa puoi esportare: un PDF per i tuoi archivi o per l'assicurazione, un foglio di calcolo, un archivio completo."
- tipo: "h2"
  testo: "6. Cosa succede se smetti di pagare?"
- tipo: "p"
  testo: "Alcune app bloccano le tue registrazioni, altre le cancellano, altre le lasciano leggibili. Scoprilo prima di aver registrato tre anni di giornate al poligono."
- tipo: "h2"
  testo: "7. Su quali dispositivi?"
- tipo: "p"
  testo: "Solo iPhone, o anche iPad e Mac? Android? Si sincronizza fra i dispositivi, o vive su uno solo?"
- tipo: "h2"
  testo: "8. Cosa è gratis, davvero?"
- tipo: "p"
  testo: "I piani gratuiti cambiano molto: alcuni limitano quante armi puoi registrare, altri chiudono funzioni come la manutenzione o le statistiche. Guarda i limiti, e se il piano a pagamento ha una prova gratuita."
- tipo: "h2"
  testo: "9. Qualcuno ci lavora ancora?"
- tipo: "p"
  testo: "Apri la Cronologia versioni dell'app sull'App Store e guarda quando è stata aggiornata l'ultima volta. Poi leggi qualche recensione, e guarda se lo sviluppatore risponde."
- tipo: "h2"
  testo: "Dove sta AIMONX"
- tipo: "tabella"
  intestazione: ["Cosa controllare", "AIMONX"]
  righe:
  - - "Conta i colpi al posto tuo"
    - "Sì. Registri una sessione e il totale dell'arma si aggiorna. Modifichi o elimini una sessione e i totali seguono."
  - - "Manutenzione"
    - "Le tue regole a colpi, a tempo o tutte e due, col preavviso che scegli tu. Cosa scade lo vedi nell'app: non ci sono notifiche di manutenzione."
  - - "Munizioni e costi"
    - "Ogni scatola che compri, i lotti più vecchi usati per primi, il costo per colpo, l'avviso di scorta bassa. Ricette e costi dei componenti sono di Pro."
  - - "Dove stanno i tuoi dati"
    - "Cifrati sul tuo iPhone, con una copia cifrata nel tuo iCloud che puoi spegnere. Nessun account. Nessun server AIMONX."
  - - "Portare fuori i dati"
    - "Il PDF di un'arma o di tutto l'inventario, gratis. Un archivio completo da spostare su un iPhone nuovo è di Pro. Nessuna esportazione in foglio di calcolo."
  - - "Se smetti di pagare"
    - "Non si cancella niente. Quello che supera i limiti gratuiti resta in sola lettura, e torna usabile quando rinnovi."
  - - "Dispositivi"
    - "Solo iPhone. Nessuna app per iPad, Mac o Android, e nessuna sincronizzazione fra dispositivi."
  - - "Cosa è gratis"
    - "Un'arma attiva con sessioni illimitate, le munizioni commerciali, una regola di pulizia per arma, tutte le statistiche e il calcolo del Power Factor. Chi si abbona per la prima volta ha il primo mese di Pro gratis."
  - - "Qualcuno ci lavora"
    - "La versione 1.1.0 è uscita a novembre 2026. Ogni aggiornamento è nella pagina Novità."
badge: "Scarica su App Store"
