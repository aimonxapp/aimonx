meta:
  title: "Novità: tutte le versioni dell'app | AIMONX"
  description: "Cosa è cambiato in ogni versione di AIMONX, l'app diario per armi su iPhone, dalla più recente."

titolo: "Novità di AIMONX"
sommario: "Ogni aggiornamento dell'app, dal più recente."

blocchi:
  # ⭐ Giro W35: la riga della recensione, in testa.
  - tipo: p
    testo: "Ti piacciono le novità? Lascia una recensione su App Store: aiuta altri tiratori a trovare AIMONX."
  - tipo: h2
    testo: "Versione 1.1.0 — 2 novembre 2026"
  - tipo: ul
    voci:
      - "Foto: fino a 5 per arma e per sessione, 3 per munizione. La prima può diventare l'icona"
      - "Manutenzione anche a tempo: a giorni o mesi, a colpi, o tutte e due. E il preavviso ora è gratis"
      - "Il costo della ricarica da quello che hai speso (Pro): scrivi il prezzo di palle, inneschi, bossoli e polvere, e AIMONX calcola il costo per colpo"
      - "Velocità alla volata, Power Factor ed energia per ogni munizione, e il Calcolo Power Factor nella Home"
      - "I tuoi poligoni sulla mappa, con le Indicazioni di Mappe di Apple"
      - "Sessioni: distanza, meteo, vento, temperatura e Copia l'ultima sessione"
      - "Armi: capacità e specifiche tecniche (azione, scatto, finitura, canna)"
      - "Munizioni: icona a scelta, le esaurite restano in vista, statistiche degli ultimi 12 mesi"
      - "La copia cifrata su iCloud si aggiorna più spesso, e c'è il nuovo tasto Esegui backup adesso"
      - "Ora anche in francese e spagnolo"
      - "Prova AIMONX Pro gratis per un mese (nuovi abbonati)"
  - tipo: h2
    testo: "Versione 1.0.1 — 15 ottobre 2026"
  - tipo: ul
    voci:
      - "Nuovo tasto Esegui backup adesso nella pagina Backup AIMONX, per fare il backup su iCloud quando vuoi."
      - "Il backup su iCloud ora si rimette in pari anche quando apri l'app, non solo quando la chiudi."
      - "Corretto un arresto dell'app durante l'eliminazione di un'arma."
      - "Il backup di diari grandi usa molta meno memoria."
  - tipo: h2
    testo: "Versione 1.0.0 — 8 ottobre 2026"
  - tipo: p
    testo: "La prima versione. Registra le tue armi, le sessioni al poligono e le gare. Tieni il conto di colpi, munizioni, manutenzione, scadenze e costi. Crea report PDF delle tue armi. Il diario è cifrato sul tuo iPhone, con una copia cifrata nel tuo iCloud."

