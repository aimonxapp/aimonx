# _data/landing.yml — IL TESTO DELLA LANDING, UNA VOLTA SOLA.
#
# ⛔ QUESTO FILE NON È CODICE: è il testo approvato da Pier il 22/09/2026, che
# sta in `…/8- AIMONX web/2- Contenuti/landing/landing-en-bozza.md`. Copiato
# PAROLA PER PAROLA. Le note fra quadre della bozza sono per Cowork e non sono
# qui, perché non vanno in pagina.
#
# ⛔ CHI PUÒ CAMBIARLO: Cowork, non Claude Code. «I testi che l'utente legge li
# scrive Cowork» (CLAUDE.md, «Chi decide cosa») — è l'unica zona del repo senza
# controprova meccanica: non esiste un test che dica se una frase è chiara o se
# il tono è sportivo invece che militare.
#
# ⭐ QUEL CHE CC PUÒ FARE, E LO HA SCRITTO PIER (22/09/2026, in testa alla
# bozza): una frase si può DIVIDERE IN PEZZI — liste, span — per
# l'impaginazione, ⛔ purché le parole restino identiche e il CONTROLLO lo
# provi. Si dichiara nella consegna, non si chiede ogni volta. È per questo che
# qui dentro ci sono tre liste dove la bozza ha tre frasi: il titolo della
# parte alta, il proclama della privacy e il motto a mano.
#
# ⭐ E DAL GIRO W8 IL CONTROLLO MORDE DAVVERO: la bozza contiene SOLO il testo
# in vigore — la storia sta nel suo `_archivio/` — quindi una frase vecchia
# rimasta qui non trova più dove nascondersi. ⚠️ Prima non era così: fino al W8
# la bozza teneva dentro la versione superata dell hero e una riga che citava
# tutte le frasi vecchie, e il controllo le avrebbe accettate. Provato a mano
# nel W8 rimettendo due frasi vecchie: le becca tutte e due.
#
# ⭐ PERCHÉ IL TESTO STA IN UN FILE DI DATI E NON DENTRO LE PAGINE. Nasce nel
# giro W4, che costruiva tre varianti visive della stessa landing con la
# condizione «stesso testo»: se il testo fosse stato dentro le pagine, sarebbe
# stato scritto tre volte e sarebbe divergìto alla prima correzione.
# ⭐ LE VARIANTI NON CI SONO PIÙ — dal giro W5 la landing è una sola — ma la
# ragione è diventata più forte, non più debole: il testo che il pubblico legge
# ha UN posto solo, e `scripts/testo-approvato.sh` può cercarlo tutto nella
# bozza. Se stesse sparso nel layout e nel foglio di stile, quel controllo non
# saprebbe dove guardare.
#
# ⚠️ DUE COSE QUI DENTRO SONO SCELTE DI CC, e vanno guardate da Cowork:
#   · `meta.title` e `meta.description` — la bozza non dice quali righe usare
#     come titolo e descrizione della scheda. Il titolo è la riga del footer
#     senza il punto, la descrizione è il paragrafo dell'hero.
#     ⭐ DAL GIRO W12 NON SONO PIÙ ECCEZIONI DICHIARATE: tutte e due stanno
#     ALLA LETTERA nella bozza, quindi `scripts/testo-approvato.sh` le cerca
#     come ogni altra stringa. ⛔ Prima le perdonava senza guardarle, e una
#     descrizione rimasta vecchia non l'avrebbe vista nessuno (`WD38`).
#   · l'icona in testa alla pagina porta `alt=""`, cioè è dichiarata
#     DECORATIVA: accanto c'è già il nome «AIMONX» scritto in lettere, e un
#     testo alternativo lo farebbe leggere due volte a chi usa un lettore di
#     schermo. È una scelta di CC, non della bozza.
#
# ⛔ QUI DENTRO NON C'È NIENTE CHE NON SIA TESTO. Il glifo e il colore di
# ciascuna voce — che sono grafica, non parole — stanno in `_data/aspetto.yml`,
# che è di Claude Code. ⭐ La separazione non è ordine per l'ordine: fa sì che
# `scripts/testo-approvato.sh` possa cercare OGNI stringa di questo file nella
# bozza, senza eccezioni da ricordarsi — e un'eccezione che nessuno ricorda è
# il buco da cui rientra il testo riscritto.
#
# ⭐ COSA È RIENTRATO, E PERCHÉ. Fino al giro W8 la riga del footer «Privacy
# Policy · Support · Terms of Use» NON era qui: il giro W4 §3③ diceva che quei
# link non si mostrano finché le pagine non esistono (WA1, WA2, WA3) — niente
# link rotti, niente segnaposto. ⭐ Dal giro W9 le tre pagine esistono e la riga
# è nella bozza approvata: la condizione è soddisfatta, non aggirata.

brand: "AIMONX"

# ⭐ LA BARRA IN ALTO, dal giro W10 — decisa e approvata da Pier il 22/09/2026.
# Le sette stringhe stanno nella bozza, sezione `## Menu`: le sei voci sono
# una riga sola là dentro («Home · Features · Privacy · Security · Free and
# Pro · Support»), spezzata qui in sei perché ciascuna è un LINK diverso — la
# stessa ragione dei tre link del piede, e la stessa regola di Pier.
# ⛔ Il «·» che le separa in pagina non è qui: è un segno, non una parola.
# ⛔ E `apri` è l'etichetta del pulsante che sul telefono apre le voci: anche
# quella è nella bozza, da sola, su una riga sua.
# ⚠️ Dove portano sta in `_data/collegamenti.yml`, che è di CC.
menu:
  # ⭐ «Home» in testa, dal giro W10 fase B — Pier, 22/09/2026: «metti anche
  # home insieme agli altri link». ⚠️ La bozza la dava per il giro W11: ha
  # deciso Pier di anticiparla, e la nota della bozza è da riallineare.
  voci:
    - "Home"
    - "Features"
    - "Privacy"
    - "Security"
    - "Free and Pro"
    - "Support"
  apri: "Menu"

meta:
  # Due righe della bozza, alla lettera: vedi la nota qui sopra.
  title: "AIMONX — the technical logbook app for sport shooters"
  description: "AIMONX is the technical logbook app for sport shooters. Firearms, rounds, range sessions, ammo, maintenance and costs — all in one place, on your iPhone."

# ⛔ LA PARTE ALTA È LA «HERO — versione 2» DELLA BOZZA, non la 1. Pier l'ha
# decisa il 22/09/2026 guardando `riferimento-hero-chatgpt.png`, e la versione 1
# resta nella bozza marcata «superata». Qui c'è solo la 2.
#
# ⚠️ IL TITOLO È UNA LISTA DI TRE RIGHE, e non è impaginazione travestita da
# testo: la bozza lo scrive su tre righe («Do you really know / how many rounds
# / your gun has fired?») e dice che la CENTRALE va in verde. Una frase sola
# non potrebbe dire quale sia la centrale, e il verde finirebbe dove capita a
# seconda della larghezza della finestra.
#
# ⚠️ `punti` e `garanzie` hanno il loro aspetto — il glifo — in
# `_data/aspetto.yml`, accoppiato per posizione come le sette voci.
hero:
  sopratitolo: "TRACK · MAINTAIN · SHOOT BETTER"
  titolo:
    - "Do you really know"
    - "how many rounds"
    - "your gun has fired?"
  lead: "AIMONX is the technical logbook app for sport shooters. Firearms, rounds, range sessions, ammo, maintenance and costs — all in one place, on your iPhone."
  punti:
    - forte: "Organize"
      resto: "your firearms"
    - forte: "Track"
      resto: "your progress"
    - forte: "Plan"
      resto: "your maintenance"
    - forte: "Know"
      resto: "your real costs"
  # ⭐ DAL GIRO W12 L'APP È SULLO STORE (08/10/2026), e al posto dell'etichetta
  # arancio «Coming soon for iPhone» c'è il BADGE UFFICIALE di Apple, che porta
  # allo Store. ⛔ QUESTA STRINGA NON SI SCRIVE IN PAGINA: è il TESTO
  # ALTERNATIVO dell'immagine del badge, cioè quel che sente chi non la vede —
  # ed essendo l'unico contenuto del link, è anche il suo nome accessibile.
  # Lo dice la bozza, che la tiene nell'Hero al posto dell'etichetta.
  # ⚠️ Le parole coincidono con quelle disegnate nel badge, e non è un caso: un
  # testo alternativo che dicesse altro racconterebbe un'altra immagine.
  # ⛔ Dove porta sta in `_data/collegamenti.yml` (`store`), il file del badge
  # e le regole di Apple in `_layouts/landing.html` e `assets/css/b.scss`.
  badge: "Download on the App Store"
  # ⭐ DAL GIRO W14 LA PARTE ALTA MOSTRA L'APP: accanto alla domanda c'è la
  # schermata Home, al posto del logo grande. ⛔ COME `badge` QUI SOPRA, QUESTA
  # STRINGA NON SI SCRIVE IN PAGINA: è il TESTO ALTERNATIVO dell'immagine, cioè
  # quel che sente chi non la vede. Sta nella bozza, sezione «Screenshots — alt
  # text», prima riga. ⛔ Sotto l'immagine non c'è nessuna didascalia, e non
  # deve nascerne una qui: sarebbe una parola nuova (giro W14 §2②).
  # ⚠️ Quale file sia l'immagine sta in `_data/aspetto.yml`, che è di CC.
  schermata: "The Home screen in AIMONX: each firearm with its round count, your last 30 days at a glance, and upcoming renewals."
  riga: "YOUR SHOOTING DATA. ALWAYS WITH YOU."
  garanzie:
    - "No account"
    - "No tracking"
    - "No AIMONX servers"
  # ⭐ Il motto va scritto a mano: il font sta in `assets/fonts/`, servito da
  # aimonx.app, ed è la sola parola di questa pagina che non usa la pila di
  # sistema.
  #
  # ⚠️ DUE PEZZI, COME IL PROCLAMA E COME LA DOMANDA, e per la stessa ragione:
  # una frase per riga. ⛔ NON è una riscrittura — rimessi in fila danno parola
  # per parola la riga della bozza, «Same passion. Every round counted.», e
  # `scripts/testo-approvato.sh` cerca ciascuno dei due ALLA LETTERA là dentro.
  # ⛔ PERCHÉ NON BASTAVA RIMPICCIOLIRE IL CORPO, ed è un conto, non un gusto:
  # nella colonna da 256 px il motto nuovo sta su tre righe, e la terza è
  # «counted.» da sola. Per farci stare «Every round counted.» su una riga
  # servirebbe un corpo da 27.8 px o meno — ma a quel corpo ci sta anche «Same
  # passion. Every», che il browser metterebbe sulla prima riga spostando il
  # taglio a metà della seconda frase. ⭐ Le due condizioni non possono essere
  # vere insieme: o si dice al testo dove finisce una frase, o il taglio lo
  # sceglie la larghezza della finestra.
  motto:
    - "Same passion."
    - "Every round counted."

# ⚠️ I titoli di sezione della bozza sono scritti in maiuscolo («WHAT IT KEEPS
# TRACK OF»), nello stesso stile delle etichette di struttura «HERO» e
# «FOOTER», che in pagina non vanno. Qui sono resi come TITOLI VERI, con le
# stesse parole e la maiuscola solo all'inizio. ⛔ Se per Cowork erano etichette
# e non titoli, si toglie da qui e le tre varianti si adeguano da sé.
#
# ⭐ DAL GIRO W14 OGNI VOCE HA LA SUA SCHERMATA, e `alt` è il suo TESTO
# ALTERNATIVO: non si scrive in pagina, si sente. Le sette righe vengono dalla
# sezione «Screenshots — alt text» della bozza, alla lettera.
# ⚠️ Nella bozza le otto righe sono nell'ordine delle immagini — la Home, poi
# le sette voci come stanno qui sotto. ⛔ Ma l'accoppiamento si fa GUARDANDO
# l'immagine, non contando le righe: nella prima consegna la riga della
# manutenzione era terza e la voce quarta, e presa per posizione la schermata
# delle sessioni avrebbe detto di essere la pagina di un'arma.
what:
  title: "What it keeps track of"
  items:
    - lead: "Every firearm, every round."
      body: "Log each firearm once. Rounds add up on their own from your range sessions — no mental math, no notebook."
      alt: "Your firearms in AIMONX, each with its round count and a color-coded maintenance status."
    - lead: "Range sessions and matches."
      body: "Record where you shot, what you shot and how it went — including malfunctions. Matches also record your placement, points and division."
      alt: "The Sessions list in AIMONX: practice and dry fire sessions, each with the firearm, the range and the rounds fired."
    - lead: "Ammo you can count on."
      body: "Factory ammo with lot numbers and inventory. Handloads with recipes, component costs and batches."
      alt: "Factory ammo in AIMONX, with rounds on hand and low-stock alerts."
    - lead: "Maintenance your way."
      body: "Create your own rules for each firearm — cleaning, lubrication, spring changes, anything — at the round counts you choose. Choose how early you want the heads-up, and AIMONX tells you inside the app when something is due."
      alt: "A firearm's page in AIMONX, with its total rounds and round-count maintenance rules for cleaning and a recoil spring."
    - lead: "Deadlines you won't miss."
      body: "Licenses and permits, club and range memberships, insurance — with a reminder as many days ahead as you like."
      alt: "Renewals in AIMONX: range and club memberships and a firearm license, each with its due date."
    - lead: "What your shooting really costs."
      body: "Cost per session, per round and per firearm, and how practice compares to competition."
      alt: "The cost breakdown in AIMONX: what you spend on ammo, matches and more, and cost by type of session."
    - lead: "Firearm reports in PDF."
      body: "A record sheet for each firearm and a full inventory — generated on your iPhone, optionally password-protected, shared only when you choose."
      alt: "A firearm inventory PDF made with AIMONX, with photos, serial numbers, purchase details and totals."

privacy:
  title: "Privacy"
  # ⚠️ IL PROCLAMA È UNA LISTA DI DUE PEZZI, e ⛔ NON è una frase riscritta:
  # rimessi in fila danno parola per parola la riga della bozza, «No account.
  # No AIMONX servers. We never see your data.», e `scripts/testo-approvato.sh`
  # cerca ciascuno dei due ALLA LETTERA là dentro — è quello a provare che non
  # è cambiato niente, non questa nota.
  # ⛔ PERCHÉ DUE E NON UNA (decisione di Pier, 22/09): la frase deve stare su
  # UNA riga dove c'è spazio e andare a capo SOLO qui, fra i due pezzi, dove
  # non ce n'è. ⛔ Mai in mezzo a «No AIMONX servers», che è il nome di una cosa
  # che NON esiste e spezzato si legge peggio di come si legge intero.
  # ⚠️ Il punto di andata a capo non si può dire al browser da fuori: o glielo
  # si insegna col testo, come qui, o lo sceglie lui e cambia con la finestra.
  # Stessa ragione delle tre righe della domanda in alto.
  claim:
    - "No account. No AIMONX servers."
    - "We never see your data."
  items:
    - lead: "Works offline."
      body: "Use it at the range with no signal. Your encrypted copy is saved to your own iCloud the next time you use the app with a connection."
    - lead: "Your data talks to no one but your own iCloud."
      body: "No AIMONX servers, no third parties, no analytics."
  note: "Your logbook lives encrypted on your iPhone. An encrypted copy is kept in your own iCloud — on by default, and you can turn it off — so a new phone doesn't mean starting over. Serial numbers are optional."

security:
  title: "Security"
  items:
    - lead: "Locked with Face ID."
      body: "AIMONX locks itself when you leave it and hides its content in the app switcher."
    - lead: "Advanced protection, if you want it."
      body: "Add a passphrase only you know — then not even Face ID opens your logbook at launch. Forget it, and your data can't be recovered by anyone."
      tag: "(Pro)"

piani:
  title: "Free and Pro"
  items:
    - lead: "Free is a real logbook, not a demo."
      body: "One active firearm, unlimited range sessions, factory ammo with inventory, maintenance, deadlines, statistics, PDF reports and your encrypted iCloud copy."
    - lead: "Pro removes the limits."
      body: "Unlimited firearms, handloads, unlimited maintenance rules and deadlines, matches and match stats, encrypted archives to export, and advanced protection."
    - lead: "If your Pro subscription ends, nothing gets lost."
      body: "Everything beyond the Free limits stays readable, just frozen, until you come back."

footer:
  # ⭐ Dal giro W13 la riga dice «app», e con lei il titolo di scheda e la
  # prima frase dell'hero: è la parola che un motore o una IA cercano per
  # capire COSA è AIMONX (Pier, 08/10/2026). Le quattro stringhe vanno insieme.
  tagline: "AIMONX — the technical logbook app for sport shooters."
  # ⚠️ TRE ETICHETTE, NON UNA RIGA, ed è la regola di Pier del 22/09: una frase
  # si può dividere in pezzi per l'impaginazione purché le parole restino
  # identiche e il controllo lo provi. Qui i pezzi devono essere tre perché
  # ciascuno è un LINK diverso, e un link è un pezzo per forza.
  # ⛔ Il «·» che li separa non è qui: è un segno, non una parola, e lo mette
  # `_includes/piede.html`. Dove portano sta in `_data/collegamenti.yml`.
  links:
    - "Privacy Policy"
    - "Support"
    - "Terms of Use"
  # ⭐ Dal giro W12 la riga dei marchi cita anche «Apple» e «the Apple logo»:
  # lo chiede Apple a chi usa il badge, che il suo logo lo porta dentro.
  copyright: "© 2026 Piermichele Fassio. Apple, the Apple logo, iPhone, iCloud and App Store are trademarks of Apple Inc., registered in the U.S. and other countries and regions."
  # ⭐ Dal giro W14, dopo la riga dei marchi Apple: nelle schermate dell'app si
  # leggono nomi di marche che non sono nostre (i dati di prova), e questa è
  # la riga che lo dice. Sta nel piede, quindi su tutte e quattro le pagine.
  altri_marchi: "All other trademarks are the property of their respective owners."
