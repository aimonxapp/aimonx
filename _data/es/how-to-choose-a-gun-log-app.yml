meta:
  title: "Cómo elegir una app de diario de tiro: 9 cosas que comprobar | AIMONX"
  description: "Conteo de disparos, mantenimiento, munición, privacidad, copias de seguridad y lo que es gratis de verdad. Qué comprobar en una app antes de confiarle años de registros."
titolo: "Cómo elegir una app de diario de tiro"
sommario: "Hay decenas de apps para registrar armas, munición y sesiones en el campo de tiro, y en el App Store muchas se parecen. Esto es lo que comprobaríamos antes de confiarle a una años de registros. Nosotros hacemos una de esas apps, así que al final te contamos dónde está AIMONX, incluido en qué se queda corta."
blocchi:
- tipo: "h2"
  testo: "1. ¿Cuenta los disparos por ti?"
- tipo: "p"
  testo: "Algunas apps te hacen escribir el total a mano. Las mejores suman tus sesiones: apuntas lo que has disparado y el contador del arma lo sigue. Prueba a corregir una errata en una sesión antigua: el total también tiene que corregirse solo."
- tipo: "h2"
  testo: "2. Mantenimiento por disparos, por tiempo o ambos"
- tipo: "p"
  testo: "Limpieza cada 500 disparos, un muelle recuperador nuevo a los 5000, lubricación cada tres meses. Una buena app te deja crear tus propias reglas, arma por arma, por disparos o por calendario, y te avisa antes de que toque."
- tipo: "h2"
  testo: "3. ¿Lleva la munición, y lo que cuesta?"
- tipo: "p"
  testo: "Busca munición que se registre por cajas, un stock que baje a medida que disparas, un aviso cuando te quedas sin ella y un coste por disparo real. Si recargas, mira si gestiona recetas y costes de componentes, o solo munición comercial."
- tipo: "h2"
  testo: "4. ¿Dónde están tus datos?"
- tipo: "p"
  testo: "Es la pregunta clave. ¿La app pide una cuenta? ¿Tus datos van a los servidores del desarrollador, o se quedan en tu teléfono? ¿Están cifrados? En la página de cada app, el App Store muestra una etiqueta de privacidad: léela antes de descargar."
- tipo: "h2"
  testo: "5. ¿Puedes sacar tus datos?"
- tipo: "p"
  testo: "Los teléfonos se pierden, y las apps se cambian. Mira cómo funcionan las copias de seguridad, si puedes pasarlo todo a un iPhone nuevo y qué puedes exportar: un PDF para tus archivos o tu seguro, una hoja de cálculo, un archivo completo."
- tipo: "h2"
  testo: "6. ¿Qué pasa si dejas de pagar?"
- tipo: "p"
  testo: "Algunas apps bloquean tus registros, otras los borran y otras los dejan legibles. Entérate antes de haber registrado tres años de sesiones."
- tipo: "h2"
  testo: "7. ¿En qué dispositivos?"
- tipo: "p"
  testo: "¿Solo iPhone, o también iPad y Mac? ¿Android? ¿Se sincroniza entre dispositivos, o vive en uno solo?"
- tipo: "h2"
  testo: "8. ¿Qué es gratis de verdad?"
- tipo: "p"
  testo: "Los planes gratuitos varían mucho: algunos limitan cuántas armas puedes registrar, otros cierran funciones como el mantenimiento o las estadísticas. Mira los límites, y si el plan de pago tiene una prueba gratuita."
- tipo: "h2"
  testo: "9. ¿Sigue alguien trabajando en ella?"
- tipo: "p"
  testo: "Abre el Historial de versiones de la app en el App Store y mira cuándo se actualizó por última vez. Luego lee algunas reseñas, y fíjate en si el desarrollador las contesta."
- tipo: "h2"
  testo: "Dónde está AIMONX"
- tipo: "tabella"
  intestazione: ["Qué comprobar", "AIMONX"]
  righe:
  - - "Cuenta los disparos por ti"
    - "Sí. Registras una sesión y el total del arma se actualiza. Editas o borras una sesión y los totales la siguen."
  - - "Mantenimiento"
    - "Tus propias reglas por disparos, por tiempo o ambos, con el aviso previo que elijas. Lo que vence lo ves en la app: no hay notificaciones de mantenimiento."
  - - "Munición y costes"
    - "Cada caja que compras, los lotes más antiguos primero, el coste por disparo y el aviso de stock bajo. Las recetas y los costes de componentes son de Pro."
  - - "Dónde están tus datos"
    - "Cifrados en tu iPhone, con una copia cifrada en tu propio iCloud que puedes desactivar. Sin cuenta. Sin servidores de AIMONX."
  - - "Sacar tus datos"
    - "El PDF de un arma o de todo tu inventario, gratis. Un archivo completo para pasar a un iPhone nuevo es de Pro. Sin exportación a hoja de cálculo."
  - - "Si dejas de pagar"
    - "No se borra nada. Lo que supera los límites gratuitos queda en solo lectura, y vuelve cuando renuevas."
  - - "Dispositivos"
    - "Solo iPhone. Sin app para iPad, Mac ni Android, y sin sincronización entre dispositivos."
  - - "Qué es gratis"
    - "Un arma activa con sesiones ilimitadas, la munición comercial, una regla de limpieza por arma, todas las estadísticas y la calculadora del factor de potencia. Los nuevos suscriptores tienen el primer mes de Pro gratis."
  - - "Sigue en desarrollo"
    - "La versión 1.1.0 salió en noviembre de 2026. Cada actualización está en nuestra página de Novedades."
badge: "Descargar en el App Store"
