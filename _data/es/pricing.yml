meta:
  title: 'Free y Pro: planes y precios | AIMONX'
  description: AIMONX se descarga gratis, y Free es un diario de verdad. Pro cuesta 1,99 € al mes o 14,99 € al año, y los nuevos suscriptores tienen el primer mes gratis. Compara los dos planes.
