blocchi:
- titolo: Cuánto cuesta Pro
  forte: Pro cuesta 1,99 € al mes o 14,99 € al año.
  testo: Los nuevos suscriptores tienen el primer mes gratis, en el plan mensual o en el anual. Después, Pro se renueva al precio normal, salvo que canceles al menos 24 horas antes de que termine el mes.
  poi: 'Pro es compatible con En familia, así que también vale para tu familia. Cancela cuando quieras. Los precios cambian según el país: el App Store te muestra el tuyo.'
- titolo: Si Pro termina
  forte: Si tu suscripción a Pro termina, no se pierde nada.
  testo: Todo lo que supera los límites de Free sigue a la vista, solo que congelado, hasta que vuelvas.
  link: Mira qué pasa cuando Pro termina
- titolo: Hay más en camino
  testo: Llegarán muchas funciones nuevas en próximas actualizaciones, pensadas para cómo entrenan de verdad los tiradores deportivos.
badge: Descargar en el App Store
