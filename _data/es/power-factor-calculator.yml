meta:
  title: "Calculadora del factor de potencia para IPSC y USPSA | AIMONX"
  description: "Introduce el peso de la punta y la velocidad en boca, mira al momento tu factor de potencia y compáralo con los mínimos de major y minor de tu división. Gratis también en la app AIMONX."
titolo: "Calculadora del factor de potencia para IPSC y USPSA"
sommario: "¿Major o minor? Introduce el peso de la punta y la velocidad en boca, y verás el factor de potencia y la energía mientras escribes. Luego compara el número con tu división, aquí abajo. La misma calculadora es gratis en la app AIMONX, a un toque desde Inicio."
calcolatore:
  peso: "Peso de la punta (grains)"
  velocita: "Velocidad en boca"
  unita: ["fps", "m/s"]
