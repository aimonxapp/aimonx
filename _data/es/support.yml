meta:
  title: Soporte y contacto | AIMONX
  description: "¿Una pregunta, un fallo o una idea para AIMONX? Escribe a support@aimonx.app. Cada correo lo lee quien hace la app."
titolo: Soporte
blocchi:
- tipo: p
  testo: "¿Tienes una pregunta, has encontrado un fallo o tienes una idea para AIMONX? Escríbenos a support@aimonx.app. Puedes escribirnos en español o en inglés."
- tipo: p
  testo: Echa un vistazo a las FAQ para resolver rápido las dudas sobre iPhone nuevo, contraseñas y Free o Pro.
- tipo: p
  testo: AIMONX lo hace un único desarrollador independiente, así que cada correo lo lee la persona que construye la app.
- tipo: h2
  testo: Para que podamos ayudarte
- tipo: p
  testo: 'Dinos:'
- tipo: ul
  voci:
  - el modelo de tu iPhone y la versión de iOS
  - tu versión de AIMONX (la encuentras en los ajustes de la app)
  - qué hiciste, qué esperabas y qué pasó en realidad
- tipo: p
  testo: Una captura de pantalla también ayuda.
- tipo: h2
  testo: Lo privado, mejor que siga privado
- tipo: p
  testo: Nunca necesitamos tus números de serie, fotos de tus armas ni tu diario para ayudarte. No los incluyas en el correo, y difumínalos si aparecen en una captura.
# ⭐ Giro W34: la recensione, prima di «Privacidad y condiciones». Il link lo fa `_includes/frase.html` (`recensione`).
- tipo: h2
  testo: "¿Te gusta AIMONX? Deja una reseña"
- tipo: p
  testo: "Una valoración en el App Store ayuda a otros tiradores a encontrar la app. Escribir una reseña — lleva un minuto, y las leemos todas."
- tipo: h2
  testo: Privacidad y condiciones
- tipo: ul
  voci:
  - Política de privacidad (en inglés)
  - "Condiciones de uso (en inglés)"
