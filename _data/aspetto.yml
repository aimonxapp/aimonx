# _data/aspetto.yml — l'ASPETTO delle voci: un segno, un colore e, dal
# giro W14, una schermata dell'app ciascuna.
#
# ⛔ QUESTO FILE È DI CLAUDE CODE, `_data/landing.yml` è di Cowork. La riga fra
# i due è quella fra «cosa dice il sito» e «come si vede», ed è la stessa riga
# di CLAUDE.md, «Chi decide cosa».
#
# ⛔ I COLORI NON SONO SCELTI A GUSTO. Sono la rampa d'identità delle sezioni
# dell'app (`…/7- App AIMONX/1- Specifiche/tavolozza-aimonx.md` §4b): nell'app
# «Armi» è verde, «Manutenzione» è ardesia, «Munizioni» è ciano. Chi ha già
# visto l'app riconosce la sezione dal colore prima di leggere il titolo, e
# ⭐ la regola di §4b — due voci vicine non portano mai la stessa tinta né due
# tinte della stessa coppia (verde/lime, teal/ciano, salvia/ardesia,
# oro/arancio tenue) — è rispettata nell'ordine qui sotto.
#
# ⛔ SEGNO, TINTA E SCHERMATA DELLE FUNZIONI NON SONO PIÙ QUI, dal giro W24:
# stanno in `_data/funzioni.yml`, accanto al testo di ciascuna (chiave
# `aspetto`). Qui resta l'aspetto di ciò che non è una funzione: la parte alta,
# le misure delle schermate e le schermate delle pagine-funzione.

# --- le schermate dell'app, dal giro W14 ----------------------------------
#
# ⭐ `schermata:` qui sopra è il NOME del file senza la larghezza e senza
# l'estensione: i file veri stanno in `assets/img/screenshots/`, tre per
# immagine, e li rifà `scripts/schermate.mjs` dalle sorgenti di Pier — la
# stessa lista di nomi sta là. ⛔ Il testo alternativo NON è qui: è una frase
# che qualcuno sente, quindi è di Cowork e sta in `_data/landing.yml` (`alt`).
#
# ⚠️ LE MISURE SONO UNA PER FORMA, non una per immagine, perché le sette
# schermate sono tutte 1290×2796 e ridotte allo stesso modo. `larga`/`alta`
# sono i pixel del file di mezzo e servono al browser per TENERE IL POSTO prima
# che l'immagine arrivi: senza, la pagina salterebbe a ogni schermata caricata.
# ⛔ Chi cambia le larghezze in `scripts/schermate.mjs` le cambia anche qui.
schermate:
  telefono: { larghezze: [430, 645, 860],  larga: 645, alta: 1398 }
  foglio:   { larghezze: [600, 900, 1200], larga: 900, alta: 482 }  # ⚠️ 482 e non 637: senza il bianco (W14)

# --- le pagine-funzione, dal giro W15 ---------------------------------------
#
# Per ogni pagina (la chiave è il suo `dati:`), i nomi delle sue schermate
# NELL'ORDINE IN CUI COMPAIONO nel testo: `_layouts/funzione.html` li accoppia
# alle righe `alt` del file di Cowork per posizione. ⛔ Stessa fragilità delle
# carte, stesso controllo: `scripts/testo-approvato.sh` confronta i conti.
# ⚠️ `aimonx-maintenance-rules` è la stessa schermata della landing: un file
# solo, due pagine.
funzioni:
  round-count:
    - aimonx-session-rounds
    - aimonx-maintenance-rules
    - aimonx-rounds-by-firearm
    - aimonx-firearm-stats
  # ⭐ Giro W16. ⚠️ `aimonx-app-switcher` è il RITAGLIO della sola scheda di
  # AIMONX: l'originale non è nel repo (vedi `scripts/schermate.mjs`).
  your-data:
    - aimonx-app-locked
    - aimonx-app-switcher
    - aimonx-icloud-backup
    - aimonx-advanced-protection
  # ⭐ Giro W17, la terza. ⚠️ Le prime due sono schermate già nel sito (la
  # landing le usa): un file solo, due pagine. Le ultime tre sono nuove.
  # ⭐ Giro W18: le FAQ hanno UNA schermata, la stessa di «Your data».
  faq:
    - aimonx-icloud-backup
  maintenance:
    - aimonx-maintenance-rules
    - aimonx-firearms-round-count
    - aimonx-maintenance-mark-as-done
    - aimonx-maintenance-new-entry
    - aimonx-maintenance-log
  # ⭐ Giro W23, la quarta: cinque schermate nuove. ⚠️ `aimonx-manage-lists` è
  # anche sulla landing, sulla carta «Your lists»: un file solo, due pagine.
  custom-lists:
    - aimonx-manage-lists
    - aimonx-bullet-types-custom
    - aimonx-malfunctions
    - aimonx-caliber-picker
    - aimonx-maintenance-types-icons

# La schermata della parte alta: la Home dell'app, accanto alla domanda.
hero_schermata: aimonx-home-screen

# --- la parte alta, dal giro W6 -------------------------------------------
#
# ⚠️ STESSO ACCOPPIAMENTO PER POSIZIONE delle voci qui sopra, con la
# stessa fragilità e lo stesso controllo: `scripts/testo-approvato.sh` confronta
# le lunghezze delle tre coppie e protesta se una scivola.
#
# ⛔ I QUATTRO SEGNI NON SONO SCELTI A CASO: ⭐ dal giro W26 sono GLI STESSI
# delle carte più in basso, icone piene come nell'app (`_includes/segno.html`)
# — la pistola di Pier è «Armi», la linea che sale «Statistiche», la chiave
# «Manutenzione», le monete «Costi». Chi scorre ritrova in alto i segni che
# rivede nelle carte. ⚠️ I glifi a tratto del W14 si leggono al commit `4f08921`.
hero_punti:
  - sagoma: pistola-striker     # Organize your firearms → «Armi» nell'app
  - icona: chart-line-up-fill   # Track your progress    → «Statistiche»
  - icona: wrench-fill          # Plan your maintenance  → «Manutenzione»
  - icona: coins-fill           # Know your real costs   → «Costi»

# ⚠️ IL TERZO GLIFO È UNA SCELTA DA GUARDARE, non un fatto: «No AIMONX servers»
# è un server BARRATO, non una nuvola barrata. ⛔ La nuvola direbbe il falso —
# la copia cifrata sta nell'iCloud dell'utente, e quella nuvola c'è
# (`~/Developer/AIMONX/docs/prodotto.md` §8.1). Quello che non esiste è il
# server NOSTRO, ed è quello che il segno deve dire. ⚠️ Giro W26: Phosphor un
# server barrato NON CE L'HA (cercato nel rilascio v2.0.8: c'è la nuvola
# barrata, che è proprio quella sbagliata), quindi questo resta un glifo
# disegnato da noi, `_includes/glifo.html` — ridisegnato PIENO, come le altre.
hero_garanzie:
  - icona: shield-check-fill    # No account
  - icona: lock-fill            # No tracking
  - glifo: serverno             # No AIMONX servers
