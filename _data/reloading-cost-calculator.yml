blocchi:
- tipo: p
  testo: This calculator works out costs, not loads. Always start from the load data published by your powder and bullet makers.
- tipo: calcolatore-ricarica
- tipo: h2
  testo: How the math works
- tipo: p
  testo: "Each component costs what you paid, divided by how many you got. Powder is the one that takes a step more: its price, divided by the container weight in grains, times your charge. A pound is 7,000 grains, so an 8 lb jug at $280 works out to half a cent a grain, and a 4.2-grain charge costs about two cents."
- tipo: p
  testo: "Loading the same brass more than once? Tell the calculator how many times, and it spreads the price out: a $30 bag of 100 cases you'll load five times comes to $0.06 a round."
- tipo: h2
  testo: Keep it, batch after batch
- tipo: p
  testo: This page does the math once. AIMONX keeps your recipes on your iPhone, gives every batch you load its own cost, and adds what you shoot to each range session, so you always know what a day at the range really cost you.
- tipo: p
  testo: The printable load card is a website tool. In the app, your recipes live on your iPhone, along with every batch you load.
- tipo: h2
  testo: Free and Pro
- tipo: p
  testo: The calculator on this page is free for everyone. In the app, handload recipes, component costs and batches are part of Pro. The Power Factor calculator is free in both.
badge: Download on the App Store
