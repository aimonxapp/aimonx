# --- LO STORE, dal giro W12 --------------------------------------------------
#
# ⭐ L'indirizzo dell'app sull'App Store, in vendita dall'08/10/2026. Lo usa il
# badge della landing (`_layouts/landing.html`), ed è scritto UNA volta qui.
# ⛔ NUDO, E DEVE RESTARLO: il generatore di badge di Apple ci attacca i
# parametri di campagna (`itsct`, `itscg`, `mt`, `ct`…), che servono a contare
# chi arriva da dove — cioè tracciamento, e il vincolo del sito dice di no.
# ⚠️ Anche senza il paese (`/us/`): così è Apple a portare ciascuno al proprio
# Store. ⛔ Che resti senza `?` lo misura `scripts/misure-pagine.rb`
# (`badge_guasti`), sulla FORMA dell'indirizzo e non su questo valore.
# ⚠️ È un link, non una risorsa: la pagina non scarica niente da apple.com.
store: "https://apps.apple.com/app/aimonx/id6794895643"

# ⭐ Giro W31: la scheda della prima scatola del Range System, per la lingua della
# pagina. ⛔ NUDO: niente parametri né il `#profileId` del link dato da Pier. È un
# link, non una risorsa: dalla pagina non si scarica niente da MakerWorld.
makerworld: "https://makerworld.com/en/models/3524948-ammo-box-9mm-100-rounds-aimonx-range-system"

# ⭐ Giro W34: il riscatto del codice Pro del Range System, il modello di App Store
# Connect. ⛔ Solo su `/range-system/` (Pier: il regalo sta sul sito e solo lì).
riscatta: "https://apps.apple.com/redeem?ctx=offercodes&id=6794895643&code=RANGESYSTEM"

# ⭐ GIRO W39 — LE SEZIONI DELLA BARRA IN ALTO E DEL PIEDE, una volta sola per
# tutte le lingue (Pier, 09/11/2026: il riferimento è il funzionamento di
# apple.com). ⛔ Qui ci sono INDIRIZZI, non parole: il nome di ogni sezione sta
# in `_data/<lingua>/navigazione.yml` (`menu.sezioni`, stessa chiave), e il nome
# di ogni voce si trova dall'indirizzo (`_includes/voci-dove.html`):
#   · `funzioni` sono le nove pagine-funzione, dalla fonte unica, col loro segno;
#   · `/features/` è «All features» (`menu.tutte`), `store` è «Download»;
#   · ogni altro indirizzo prende il nome della PRIMA voce che porta lì in
#     `menu`, qui sotto, nella lingua della pagina.
# ⛔ NIENTE LINK MORTI: un indirizzo che nella lingua della pagina non ha una voce
# in `menu` non si scrive (fino al W39 il calcolatore della ricarica e la guida,
# solo in inglese), e una sezione che resta senza voci non si apre — sparisce.
#   · `dove`: la sezione è un link e basta, niente pannello (Range System,
#     Pricing): «pronta ad avere sottovoci» vuol dire scriverle qui, in `gruppi`;
#   · `gruppi`: il pannello, un gruppo per colonna; tutte le voci alla stessa
#     misura (Pier, 09/11/2026), il primo gruppo solo più chiaro;
#   · `piede`: nel piede le voci in fila (ogni sezione con un pannello ce l'ha:
#     Liquid non sa appiattire i gruppi). Nel piede le sezioni stanno in fila,
#     una colonna ciascuna, in quest'ordine (Pier, 09/11/2026).
sezioni:
  - nome: funzioni
    gruppi:
      - [funzioni]
      - ["/updates/", "/features/"]
    piede: ["/updates/", funzioni, "/features/"]
  - nome: range
    dove: "/range-system/"
  - nome: strumenti
    gruppi:
      - ["/features/power-factor-calculator/", "/reloading-cost-calculator/", "/guides/how-to-choose-a-gun-log-app/"]
    piede: ["/features/power-factor-calculator/", "/reloading-cost-calculator/", "/guides/how-to-choose-a-gun-log-app/"]
  - nome: prezzi
    dove: "/pricing/"
    # Nel piede «Pricing» porta anche «Download», che nel piede c'era già.
    piede: ["/pricing/", store]
  - nome: assistenza
    gruppi:
      - ["/faq/", "/support/"]
      - [recensione, "/about/"]
      - ["/privacy-policy/", "/terms/"]
    # Nel piede le due pagine legali stanno nella riga in fondo (`legali`).
    piede: ["/faq/", "/support/", recensione, "/about/"]

# ⭐ Giro W39: la riga in fondo al piede, dopo il copyright.
legali: ["/privacy-policy/", "/terms/"]

# ⭐ Giro W39: da indirizzo a CHIAVE del nome, per i pannelli e il piede
# (`_includes/voci-dove.html`): il nome sta in `_data/<lingua>/navigazione.yml`,
# `menu.pagine`, dove la modalità modifica lo vede. ⛔ Qui nessuna parola.
pagine:
  "/updates/": novita
  "/reloading-cost-calculator/": ricarica
  "/guides/how-to-choose-a-gun-log-app/": guida
  "/pricing/": prezzi
  "/faq/": faq
  "/support/": assistenza
  recensione: recensione
  "/about/": chi
  "/privacy-policy/": privacy
  "/terms/": termini

# --- LA NAVIGAZIONE: barra, tendina e piede (giro W10, rifatta nel W24) ----
#
# ⚠️ È UNA MAPPA A PARTE da `frasi` qui sopra, e la ragione è che le due cose
# sono diverse: `frasi` trasforma una parola IN MEZZO A UNA FRASE in un link,
# `menu` dice dove porta una VOCE — della barra o del piede. Mischiarle vorrebbe
# dire che scrivere «Features» dentro un paragrafo lo trasformerebbe in un link.
#
# ⭐ DAL GIRO W24 LA SERVONO IN TRE: la barra, la tendina e il piede a colonne
# leggono tutti questa mappa, quindi una voce porta nello stesso posto ovunque.
# ⛔ Dove una voce compare anche in `frasi` («FAQ», «Support», «What's new»,
# «Privacy Policy», «Terms of Use»), i due indirizzi DEVONO coincidere: se uno
# sbagliasse, `link_rotti` di `scripts/misure-pagine.rb` lo troverebbe — ogni
# indirizzo interno di ogni pagina costruita deve risolvere.
#
# ⛔ «Download» NON è un indirizzo di questo sito: `store` vuol dire «il link
# allo Store qui sopra», nudo, scritto una volta sola. È un link di TESTO
# (giro W24 ②): ⛔ il badge di Apple resta uno per pagina, e questo non lo è.
# ⭐ Dal giro W29 non sta più in questa mappa: barra e piede lo chiamano con
# `dove='store'`, e il link è quello della lingua della pagina (`_data/lingue.yml`).
#
# ⭐ Giro W25: «Free and Pro» porta alla pagina `/pricing/`, non più alla
# sezione della landing — e lì porta anche il link «Compare Free and Pro» in
# fondo a quella sezione. ⭐ «Home» TORNA nella barra (Pier, 16/10/2026
# 22:07: l'aveva decisa il 22/09, e l'architettura l'aveva tolta per errore).
# «Privacy» e «Security» restano fuori: la privacy ha la sua pagina, «Your
# data», nella tendina, e le due sezioni della landing restano.
menu:
  # ⭐ Giro W35: la voce del piede verso la recensione (`_includes/voce.html`).
  "Write a review": "recensione"
  "Home":           "/"
  "Features":       "/features/"
  "All features":   "/features/"
  "FAQ":            "/faq/"
  "Range System":   "/range-system/"
  # ⭐ Giro W38: le due pagine nuove (dal giro W40 in ogni lingua, ciascuna nel
  # suo `collegamenti.yml`).
  "Reloading cost calculator":   "/reloading-cost-calculator/"
  "How to choose a gun log app": "/guides/how-to-choose-a-gun-log-app/"
  "Free and Pro":   "/pricing/"
  "Compare Free and Pro": "/pricing/"
  "What's new":     "/updates/"
  # ⭐ Giro W36: la pagina About, dalla colonna App del piede.
  "About":          "/about/"
  "Support":        "/support/"
  "Privacy Policy": "/privacy-policy/"
  "Terms of Use":   "/terms/"

